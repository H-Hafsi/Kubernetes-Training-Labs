<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Fond Gradient : Noir Ardoise à gauche vers Bleu Ultramarine / Indigo Kubernetes à droite -->
    <linearGradient id="bgK8sDiff" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.98" />
      <stop offset="40%" stop-color="#090d16" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.9" />
    </linearGradient>

    <!-- Gradient d'assombrissement renforcé sur toute la zone texte (gauche) -->
    <linearGradient id="leftTextDarkener" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.98" />
      <stop offset="50%" stop-color="#020617" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.0" />
    </linearGradient>

    <!-- Lueur lumineuse cyan/bleu autour du gouvernail -->
    <radialGradient id="helmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Motif de maillage d'orchestration (Réseau de pods) -->
    <pattern id="k8sGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="25" cy="25" r="1" fill="#4338ca" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Fond principal et maillage d'orchestration -->
  <rect width="1200" height="400" fill="url(#bgK8sDiff)" />
  <rect width="1200" height="400" fill="url(#k8sGrid)" />

  <!-- Halo de lumière derrière le gouvernail -->
  <circle cx="900" cy="200" r="180" fill="url(#helmGlow)" />

  <!-- Anneaux d'Orchestration & Lignes d'Ingress/Service Mesh -->
  <g stroke="#6366f1" stroke-width="1.2" fill="none" opacity="0.35">
    <ellipse cx="900" cy="200" rx="220" ry="80" stroke-dasharray="6,8" />
    <ellipse cx="900" cy="200" rx="310" ry="110" stroke-dasharray="4,10" opacity="0.2" />
    <path d="M 150 220 C 350 150, 500 280, 700 180 T 1100 220" stroke="#38bdf8" stroke-dasharray="4,6" opacity="0.4" />
  </g>

  <!-- GOUVERNAIL KUBERNETES (Wheel / Helm) en perspective isométrique à droite -->
  <g transform="translate(900, 200) rotate(-15) scale(1, 0.5)">
    <!-- Moyeu central du gouvernail -->
    <circle cx="0" cy="0" r="32" fill="#326ce5" stroke="#a5b4fc" stroke-width="4" />
    <circle cx="0" cy="0" r="14" fill="#020617" />

    <!-- Les 7 Poignées / Rayons de la roue Kubernetes -->
    <!-- Rayon 1 -->
    <g transform="rotate(0)"><rect x="-5" y="-90" width="10" height="90" rx="4" fill="#326ce5" /><circle cx="0" cy="-100" r="12" fill="#60a5fa" /></g>
    <!-- Rayon 2 -->
    <g transform="rotate(51.4)"><rect x="-5" y="-90" width="10" height="90" rx="4" fill="#326ce5" /><circle cx="0" cy="-100" r="12" fill="#60a5fa" /></g>
    <!-- Rayon 3 -->
    <g transform="rotate(102.8)"><rect x="-5" y="-90" width="10" height="90" rx="4" fill="#326ce5" /><circle cx="0" cy="-100" r="12" fill="#60a5fa" /></g>
    <!-- Rayon 4 -->
    <g transform="rotate(154.2)"><rect x="-5" y="-90" width="10" height="90" rx="4" fill="#326ce5" /><circle cx="0" cy="-100" r="12" fill="#60a5fa" /></g>
    <!-- Rayon 5 -->
    <g transform="rotate(205.6)"><rect x="-5" y="-90" width="10" height="90" rx="4" fill="#326ce5" /><circle cx="0" cy="-100" r="12" fill="#60a5fa" /></g>
    <!-- Rayon 6 -->
    <g transform="rotate(257)"><rect x="-5" y="-90" width="10" height="90" rx="4" fill="#326ce5" /><circle cx="0" cy="-100" r="12" fill="#60a5fa" /></g>
    <!-- Rayon 7 -->
    <g transform="rotate(308.4)"><rect x="-5" y="-90" width="10" height="90" rx="4" fill="#326ce5" /><circle cx="0" cy="-100" r="12" fill="#60a5fa" /></g>

    <!-- Anneau extérieur reliant les poignées -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#38bdf8" stroke-width="8" opacity="0.9" />
  </g>

  <!-- PODS ORBITAUX & MICROSERVICES (Sphères orbitales distribuées) -->
  <!-- Pod 1 : Worker Pod (Cyan) -->
  <g transform="translate(720, 150)">
    <circle cx="0" cy="0" r="18" fill="#0284c7" opacity="0.8" />
    <circle cx="-4" cy="-4" r="14" fill="#38bdf8" opacity="0.9" />
    <circle cx="0" cy="0" r="26" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" />
  </g>

  <!-- Pod 2 : ReplicaSet (Vert Santé) -->
  <g transform="translate(1060, 260)">
    <circle cx="0" cy="0" r="15" fill="#059669" opacity="0.8" />
    <circle cx="-3" cy="-3" r="11" fill="#34d399" opacity="0.9" />
  </g>

  <!-- Pod 3 : Control Plane / API Server (Violet/Bleu) -->
  <g transform="translate(760, 270)">
    <circle cx="0" cy="0" r="20" fill="#4338ca" opacity="0.85" />
    <circle cx="-5" cy="-5" r="15" fill="#818cf8" opacity="0.9" />
  </g>

  <!-- Nœuds réseau secondaires -->
  <circle cx="560" cy="180" r="5" fill="#38bdf8" opacity="0.8" />
  <circle cx="560" cy="180" r="14" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4" />

  <!-- Masque final d'assombrissement renforcé sur la gauche -->
  <rect width="1200" height="400" fill="url(#leftTextDarkener)" />
</svg>
